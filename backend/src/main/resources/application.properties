spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ===== SERVER =====
server.port=8080

# ===== DATABASE (ЧЕРЕЗ SSH ТУННЕЛЬ) =====
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver


# ===== DATABASE (через переменные окружения) =====
# spring.datasource.url=jdbc:postgresql://helios.cs.ifmo.ru:5432/postgres
# spring.datasource.username=${POSTGRES_USER}
# spring.datasource.password=${POSTGRES_PASSWORD}
# # spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/avtoanalytics}
# # spring.datasource.username=${POSTGRES_USER:avtoadmin}
# # spring.datasource.password=${POSTGRES_PASSWORD}
# spring.datasource.driver-class-name=org.postgresql.Driver

# ===== JPA =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ===== FLYWAY =====
spring.flyway.enabled=true
spring.flyway.clean-disabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# ===== JWT =====
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ===== LOGGING =====
logging.level.com.avtoanalytics=DEBUG
logging.level.org.springframework.security=DEBUG

# ===== DATA INIT (ТЕСТОВЫЕ ДАННЫЕ) =====
# spring.sql.init.mode=always
# spring.sql.init.data-locations=classpath:db/migration/clean_and_reload.sql
# spring.sql.init.continue-on-error=true

# ===== MINIO =====
# Internal URL for backend (Docker to Docker communication)
minio.endpoint=${MINIO_ENDPOINT:minio}
minio.port=${MINIO_PORT:9000}
# Public URL for frontend (browser to MinIO)
minio.public-endpoint=${MINIO_PUBLIC_ENDPOINT:localhost}
minio.public-port=${MINIO_PUBLIC_PORT:9000}
minio.access-key=${MINIO_ACCESS_KEY:minioadmin}
minio.secret-key=${MINIO_SECRET_KEY:minioadmin123}
minio.bucket-name=${MINIO_BUCKET_NAME:avtoanalytics}

# Максимальный размер загружаемого файла
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB