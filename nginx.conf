events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server {
        listen 80;
        server_name localhost;
        root /usr/share/nginx/html;
        index main.html;

        # API proxy to backend
        location /api/ {
            proxy_pass http://avtoanalytics-backend:8080/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # MinIO proxy — this is what makes the relative "/minio/..." URLs
        # returned by MinioService.getDirectFileUrl() actually resolve,
        # from any host the site is opened from.
        location /minio/ {
            proxy_pass http://minio:9000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Custom 404 page for anything nginx itself can't find
        error_page 404 /404.html;
        location = /404.html {
            root /usr/share/nginx/html;
            internal;
        }

        # Cache images
        location ~* \.(svg|png|jpg|jpeg|gif|ico|webp)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri /404.html;
        }

        # ✅ FIX: .html files get BOTH the no-cache headers AND the
        # try_files fallback to /404.html, in the same block — previously
        # this was split across two separate `location ~` regexes, and
        # since nginx only evaluates the FIRST matching regex location
        # (not the most specific one), the broader "\.(html|js|css)$"
        # block always won and the html-specific try_files never ran.
        location ~* \.html$ {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires 0;
            try_files $uri /404.html;
        }

        # JS/CSS: no-cache only, plain static serving (no try_files —
        # a missing script/stylesheet should 404 loudly, not silently
        # serve back an HTML page that then fails to parse as JS/CSS)
        location ~* \.(js|css)$ {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires 0;
        }

        # Everything else (extensionless paths, trailing slashes, etc.)
        location / {
            try_files $uri $uri/ /404.html;
        }
    }
}